site_name: Ais
site_url: https://mgflast.github.io/Ais/
site_description: Fast and user-friendly segmentation of cryo-electron tomography data using convolutional neural networks.
repo_name: mgflast/Ais
repo_url: https://github.com/mgflast/Ais
copyright: © Mart So-Last, 2026, mgflast@gmail.com
nav:
   - "📖 User Guide":
       - "⚙️ Installation": installation.md
       - "<b>The Ais Workflow</b>":
          - "1️⃣ Annotating training data": guide/annotating.md
          - "2️⃣ Training a model": guide/training.md
          - "3️⃣ Assessing model performance": guide/assessing_performance.md
          - "4️⃣ Using a model": guide/using_a_model.md
       - "<b>Tutorials</b>":
          - "1️⃣ Quick start": tutorials/quick_start.md
          - "2️⃣ Microtubule inner proteins": tutorials/microtubule_inner_proteins.md
       - "<b>Additional software features</b>":
          - "🔴 Filters & display": features/filters.md
          - "🟠 Model-assisted annotation": features/model_assisted_annotation.md
          - "🟡 The active-contouring brush": features/active_contouring.md
          - "🟢 The feature library": features/feature_library.md
          - "🔵 Model interactions": features/model_interactions.md
          - "🟣 Linking Ais and Pom": features/pom.md
          - "⚪️ Rendering & visualisation": features/rendering_export.md
          - "🟤 Sharing models": features/sharing_models.md
          - "⚫️ Custom model architectures": features/custom_architectures.md
          - "🔴 The model library": features/model_library.md
          - "🥳 Party mode": features/party_mode.md
       - "Command reference": cli/reference.md
   - "🗄️ Model repository": https://www.aiscryoet.org
   - "🐞 Submit a bug": https://github.com/mgflast/Ais/issues
   - "🐸 easymode": https://mgflast.github.io/easymode/
   - "🤖 Pom": https://github.com/mgflast/Pom
theme:
   name: material
   logo: res/ais_boot_sprite.png
   favicon: res/ais_boot_sprite.png
   palette:
      # Primary/accent colours are set to a custom #f09350 in styles/extra.css
      - media: "(prefers-color-scheme: light)"
        scheme: default
        toggle:
           icon: material/weather-night
           name: Switch to dark mode
      - media: "(prefers-color-scheme: dark)"
        scheme: slate
        toggle:
           icon: material/weather-sunny
           name: Switch to light mode
   features:
      - navigation.instant
      - navigation.tracking
      - navigation.tabs
      - navigation.tabs.sticky
      - navigation.expand
      - navigation.sections
      - search.highlight
      - search.suggest
      - content.tabs.link
      - content.code.annotate
      - content.code.copy
   icon:
      annotation: material/plus-circle
markdown_extensions:
  - admonition
  - meta
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - pymdownx.highlight
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - toc:
      toc_depth: 5
extra_css:
  - styles/extra.css
extra_javascript:
  - javascripts/home.js
plugins:
  - search
